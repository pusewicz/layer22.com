{%- comment -%}
Swaps a YouTube thumbnail (note/youtube.html) for the youtube-nocookie player
when clicked, so nothing loads from YouTube's player until then. Modified
clicks still open the video on YouTube.
{%- endcomment -%}
<script>
  document.addEventListener("click", (event) => {
    const link = event.target.closest("a[data-youtube-id]");
    if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

    event.preventDefault();
    const iframe = document.createElement("iframe");
    iframe.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(link.dataset.youtubeId)}?autoplay=1`;
    iframe.title = link.getAttribute("aria-label");
    iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    iframe.className = "absolute inset-0 w-full h-full border-0";
    const player = document.createElement("div");
    player.className = "relative block aspect-video bg-black";
    player.append(iframe);
    link.replaceWith(player);
  });
</script>
