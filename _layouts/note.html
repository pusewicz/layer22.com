---
layout: default
---

<div class="w-full bg-[#F5F3F0]">
  <div class="max-w-[1080px] mx-auto px-6 pt-12 pb-8">
    <div class="max-w-[640px]">
      <a href="{{ '/notes/' | relative_url }}" class="font-display text-[14px] font-medium tracking-[0.12em] uppercase text-[#C00000] no-underline hover:text-[#8A0000] block">Notes</a>
      {% include note/entry.html note=page body=content %}
      {% if page.previous or page.next %}
      <nav class="flex justify-between border-t border-[#E2DFDB] pt-4" aria-label="More notes">
        <span>{% if page.previous %}<a href="{{ page.previous.url | relative_url }}" rel="prev" class="text-[14px] text-[#C00000] underline hover:text-[#8A0000]">&larr; Older</a>{% endif %}</span>
        <span>{% if page.next %}<a href="{{ page.next.url | relative_url }}" rel="next" class="text-[14px] text-[#C00000] underline hover:text-[#8A0000]">Newer &rarr;</a>{% endif %}</span>
      </nav>
      {% endif %}
    </div>
  </div>
</div>
{% include note/youtube-script.html %}
