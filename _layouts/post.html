---
layout: default
---

<link rel="preload" href="{{ "assets/css/syntax.css" | relative_url }}" as="style" />
<link rel="stylesheet" href="{{ "assets/css/syntax.css" | relative_url }}" />

{% include nav.html %}

<article class="post">
    <hgroup>
      <h1>{{ page.title }}</h1>
      {% assign post = page %}
      {% include post/post-meta.html categories=true tags=true %}
    </hgroup>
    {{ content }}

    <p><small>Last modified: {% last_modified_at %}<small></p>
</article>
