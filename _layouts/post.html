layout: default

{% include nav.html %}

<article class="post">
    <hgroup>
      <h1>{{ page.title }}</h1>
      {% assign post = page %}
      {% include post/post-meta.html categories=true tags=true %}
    </hgroup>
    {{ content }}

    <p><small>Last modified: {% last_modified_at %}<small></p>
</article>
