---
layout: default
---

<div class="w-full bg-[#F5F3F0]">
  <div class="max-w-[1080px] mx-auto px-6 pt-12 pb-8">
    <a href="{{ 'archive' | relative_url }}" class="font-display text-[14px] font-medium tracking-[0.12em] uppercase text-[#C00000] no-underline hover:text-[#8A0000] mb-4 block">Writing</a>
    <h1 class="font-display text-[40px] font-bold tracking-[-0.02em] text-[#0F0E0D] leading-[1.15] m-0">Tagged: {{ page.title }}</h1>

    <div class="mt-8">
      {% for post in page.posts %}
      <div class="flex items-baseline justify-between py-[10px] border-b border-[#E2DFDB]">
        <a href="{{ post.url }}" class="text-[17px] text-[#0F0E0D] no-underline hover:text-[#C00000] leading-6">{{ post.title }}</a>
        <span class="font-display text-[13px] tracking-[0.06em] uppercase text-[#9B9895] shrink-0 ml-10">{{ post.date | date: "%b %Y" }}</span>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
